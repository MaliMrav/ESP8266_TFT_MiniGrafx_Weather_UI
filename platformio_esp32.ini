; Telemetry - ESP32 composition
;
; This file defines the expanded observation-and-control reference profile.
;
; The ESP32/CYD composition is intended to support richer capabilities such as:
;
;   - MQTT
;   - local I/O
;   - API / TLS
;   - control
;   - richer UI
;
; The environment is deliberately defined here even while the CYD hardware
; configuration and capability implementations are still being brought
; online.
;

; ---------------------------------------------------------------------------
; ESP32-CYD — Expanded Observation and Control Reference Profile
; ---------------------------------------------------------------------------
[env:ESP32-CYD]

extends                 = env

platform                = espressif32
board                   = esp32dev

build_flags             = ${env.build_flags}
                          -DTELEMETRY_PROFILE_ESP32
                          -DTELEMETRY_CAPABILITY_MQTT
                          -DTELEMETRY_CAPABILITY_LOCAL_IO
                          -DTELEMETRY_CAPABILITY_API
                          -DTELEMETRY_CAPABILITY_CONTROL

lib_deps                = ${env.lib_deps}
                          knolleary/PubSubClient
