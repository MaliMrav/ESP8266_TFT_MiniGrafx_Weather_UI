; Telemetry - ESP8266 composition
;
; This file defines the constrained observation reference profile.
;
; The ESP8266 composition intentionally provides the lightweight capabilities
; appropriate to the platform:
;
;   - MQTT
;   - local I/O
;   - constrained observation UI
;
; It does not redefine Telemetry's framework architecture.
;

; ---------------------------------------------------------------------------
; ESP8266 — Constrained Observation Reference Profile
; ---------------------------------------------------------------------------
[env:ESP8266]

extends                 = env

platform                = espressif8266
board                   = esp12e

build_flags             = ${env.build_flags}
                          -DTELEMETRY_PROFILE_ESP8266
                          -DTELEMETRY_CAPABILITY_MQTT
                          -DTELEMETRY_CAPABILITY_LOCAL_IO

lib_deps                = ${env.lib_deps}
                          knolleary/PubSubClient

; ---------------------------------------------------------------------------
; OTA
; ---------------------------------------------------------------------------
; upload_flags are deliberately not defined here because the OTA credential
; belongs to the local machine configuration.
;
upload_protocol         = espota
upload_speed            = 230400
upload_port             = weather-display.local
