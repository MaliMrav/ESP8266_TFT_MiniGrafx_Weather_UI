; Telemetry - Embedded telemetry framework for ESP microcontrollers
; PlatformIO Project Configuration File
;
; PlatformIO environments are Telemetry composition profiles.
; The framework architecture and contracts remain shared between profiles.
;
; The ESP8266 environment is the constrained observation reference profile.
; The ESP32-CYD environment is the expanded observation-and-control profile.
;

[platformio]
extra_configs = platformio.local.ini
; Keep the constrained profile as the default build target.
default_envs = ESP8266

; -----------------------------------------------------------------------------
; Shared Telemetry build settings
; -----------------------------------------------------------------------------
[env]
framework = arduino
monitor_speed = 115200

build_flags =
    -I lib

lib_deps =
    https://github.com/ThingPulse/minigrafx.git
    tzapu/WiFiManager
    paulstoffregen/XPT2046_Touchscreen
    bblanchon/ArduinoJson @ ^6

; -----------------------------------------------------------------------------
; ESP8266 — Constrained Observation Reference Profile
; -----------------------------------------------------------------------------
[env:ESP8266]
extends = env
platform = espressif8266
board = esp12e

build_flags =
    ${env.build_flags}
    -DTELEMETRY_PROFILE_ESP8266
    -DTELEMETRY_CAPABILITY_MQTT
    -DTELEMETRY_CAPABILITY_LOCAL_IO

lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient

; OTA support
upload_protocol = espota
upload_speed = 230400
upload_port = weather-display.local

; -----------------------------------------------------------------------------
; ESP32-CYD — Expanded Observation and Control Reference Profile
; -----------------------------------------------------------------------------
; The CYD composition is defined here so the target is explicit, but the
; richer API/control capabilities are only instantiated when their application
; composition is wired into the framework.
;
; Validate the exact board definition and peripheral composition when CYD is
; brought online as a build target.
;
[env:ESP32-CYD]
extends = env
platform = espressif32
board = esp32dev

build_flags =
    ${env.build_flags}
    -DTELEMETRY_PROFILE_ESP32
    -DTELEMETRY_CAPABILITY_MQTT
    -DTELEMETRY_CAPABILITY_LOCAL_IO
    -DTELEMETRY_CAPABILITY_API
    -DTELEMETRY_CAPABILITY_CONTROL

lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient
