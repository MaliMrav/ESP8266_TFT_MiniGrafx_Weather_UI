; Telemetry - Embedded telemetry framework for ESP microcontrollers
; PlatformIO Project Configuration File
;
; platformio.ini is the composition root for Telemetry builds.
;
; The framework architecture remains shared.
; PlatformIO environments select the concrete platform composition.
;
; ESP8266  = constrained observation reference profile
; ESP32/CYD = expanded observation-and-control reference profile
;
; Platform-specific configuration is intentionally kept outside this file.
;

[platformio]

; ---------------------------------------------------------------------------
; Configuration composition
; ---------------------------------------------------------------------------
;
; PlatformIO reads these files as additional configuration layers.
;
; The local layer is intentionally last so machine-specific settings,
; including credentials, can override project defaults without being
; committed to the repository.
;
extra_configs               = platformio_esp8266.ini
                              platformio_esp32.ini
                              platformio.local.ini

; Keep the constrained reference profile as the default build target.
default_envs                = ESP8266

; ---------------------------------------------------------------------------
; Shared Telemetry configuration
; ---------------------------------------------------------------------------
;
; These settings belong to the framework rather than to a particular
; hardware target.
;
[telemetry]

framework                   = arduino
monitor_speed               = 115200

; Telemetry establishes an explicit C++ language baseline.
;
; GNU C++17 provides the modern language and library facilities used by
; the framework while remaining appropriate for the supported embedded
;clear toolchains.
;
build_unflags               = -std=gnu++11

build_flags                 = -I lib
                              -std=gnu++17

lib_deps                    = https://github.com/ThingPulse/minigrafx.git
                              tzapu/WiFiManager
                              paulstoffregen/XPT2046_Touchscreen
                              bblanchon/ArduinoJson @ ^6

; ---------------------------------------------------------------------------
; Shared environment defaults
; ---------------------------------------------------------------------------
;
; Concrete environments inherit the common framework configuration and then
; add the platform-specific composition defined in the corresponding file.
;
[env]

framework                   = ${telemetry.framework}
monitor_speed               = ${telemetry.monitor_speed}

build_unflags               = ${telemetry.build_unflags}
build_flags                 = ${telemetry.build_flags}

lib_deps                    = ${telemetry.lib_deps}
