; Telemetry - Embedded telemetry framework for ESP microcontrollers
; PlatformIO Project Configuration File
;
; PlatformIO environments are Telemetry's build-time composition mechanism.
; The framework defines shared contracts and capabilities; an environment
; selects the target platform, resource envelope and capabilities instantiated
; for that build.

[platformio]
default_envs = ESP8266
extra_configs = platformio.local.ini

[env]
framework = arduino
build_flags =
    -I lib
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient
    https://github.com/ThingPulse/minigrafx.git
    tzapu/WiFiManager
    paulstoffregen/XPT2046_Touchscreen
    bblanchon/ArduinoJson @ ^6

; Telemetry — Constrained Reference Profile
[env:ESP8266]
platform = espressif8266
board = esp12e
build_flags =
    ${env.build_flags}
    -DTELEMETRY_PROFILE_ESP8266
    -DTELEMETRY_CAPABILITY_MQTT
upload_protocol = espota
upload_speed = 230400
upload_port = weather-display.local

